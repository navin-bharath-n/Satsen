<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🔥 CNN Fire Detection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #020617;
            padding: 25px;
            border-radius: 10px;
            width: 380px;
            box-shadow: 0 0 20px rgba(255, 80, 80, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #f97316;
        }

        input, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #f97316;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #fb923c;
        }

        .result {
            margin-top: 15px;
            background: #020617;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🔥 CNN Fire Test</h2>

    <input type="file" id="image" accept="image/*">
    <input type="number" id="lat" placeholder="Latitude" value="13.0827">
    <input type="number" id="lon" placeholder="Longitude" value="80.2707">

    <button onclick="upload()">Check Fire</button>

    <div class="result" id="result">Waiting for upload...</div>
</div>

<script>
async function upload() {
    const img = document.getElementById("image").files[0];
    const lat = document.getElementById("lat").value;
    const lon = document.getElementById("lon").value;

    if (!img) {
        alert("Please select an image");
        return;
    }

    const form = new FormData();
    form.append("image", img);
    form.append("lat", lat);
    form.append("lon", lon);

    document.getElementById("result").innerText = "Processing...";

    try {
        const res = await fetch("http://localhost:8000/admin/upload", {
            method: "POST",
            body: form
        });

        const data = await res.json();
        document.getElementById("result").innerText =
            JSON.stringify(data, null, 2);
    } catch (err) {
        document.getElementById("result").innerText =
            "❌ Error connecting to backend";
    }
}
</script>

</body>
</html>
